function genPripadnost(n = 8) {
  const qs = [];
  for (let i = 0; i < n; i++) {
    const size = 4 + Math.floor(Math.random() * 3);
    const pool = shuffle(Array.from({
      length: 30
    }, (_, k) => k + 1));
    const setArr = sample(pool, size).sort((a, b) => a - b);
    const letter = ["A", "B", "C"][i % 3];
    const isMember = Math.random() < 0.5;
    let element;
    if (isMember) {
      element = setArr[Math.floor(Math.random() * setArr.length)];
    } else {
      do {
        element = pool[Math.floor(Math.random() * pool.length)];
      } while (setArr.includes(element));
    }
    qs.push({
      qid: uid(),
      type: "membership",
      letter,
      setArr,
      element,
      correct: isMember
    });
  }
  return qs;
}
function genKardinalnost(n = 8) {
  const qs = [];
  for (let i = 0; i < n; i++) {
    const useWords = Math.random() < 0.6;
    const letter = ["A", "B", "C"][i % 3];
    if (useWords) {
      const uni = UNIVERSES[Math.floor(Math.random() * UNIVERSES.length)];
      const uniqueCount = 3 + Math.floor(Math.random() * 4);
      const chosen = sample(uni.items, uniqueCount);
      let display = [...chosen];
      // sometimes repeat an element to reinforce "elementi skupa su različiti"
      const withDup = Math.random() < 0.4;
      if (withDup) {
        const dup = chosen[Math.floor(Math.random() * chosen.length)];
        display = shuffle([...chosen, dup]);
      }
      qs.push({
        qid: uid(),
        type: "count",
        letter,
        display: display.map(it => `${it.emoji} ${it.label}`),
        correct: uniqueCount,
        note: withDup ? "Podsjetnik: element se u skupu broji samo jednom, čak i ako je zapisan dvaput." : null

      const size = 3 + Math.floor(Math.random() * 8);
      const pool = shuffle(Array.from({
        length: 40
      }, (_, k) => k + 1));
      const setArr = sample(pool, size).sort((a, b) => a - b);
      qs.push({
        qid: uid(),
        type: "count",
        letter,
        display: setArr.map(String),
        correct: size,

function buildTwoSets({
  overlapRange = [1, 2],
  onlyARange = [1, 2],
  onlyBRange = [1, 2]

  const {
    pool,
    kind
  } = pickItemPool();
  const overlapSize = overlapRange[0] + Math.floor(Math.random() * (overlapRange[1] - overlapRange[0] + 1));
  const overlap = sample(pool, overlapSize);
  let remaining = pool.filter(it => !overlap.includes(it));
  const onlyASize = onlyARange[0] + Math.floor(Math.random() * (onlyARange[1] - onlyARange[0] + 1));
  const onlyA = sample(remaining, Math.min(onlyASize, remaining.length));
  remaining = remaining.filter(it => !onlyA.includes(it));
  const onlyBSize = onlyBRange[0] + Math.floor(Math.random() * (onlyBRange[1] - onlyBRange[0] + 1));
  const onlyB = sample(remaining, Math.min(onlyBSize, remaining.length));
  remaining = remaining.filter(it => !onlyB.includes(it));
  const distractors = sample(remaining, Math.min(2, remaining.length));

    pool,
    kind,
    overlap,
    onlyA,
    onlyB,
    distractors

/* ---------------- manual question builders (for the teacher "Zadaci" editor) ---------------- */

function parseTokens(str) {
  return (str || "").split(",").map(s => s.trim()).filter(Boolean);
}
function toItems(tokens) {
  // de-duplicate case-insensitively while keeping first-seen casing
  const seen = new Map();
  tokens.forEach(t => {
    const key = t.toLowerCase();
    if (!seen.has(key)) seen.set(key, {
      id: key,
      label: t,
      emoji: null
    });
  });
  return Array.from(seen.values());
}
function makeMembershipQuestion({
  letter = "A",
  setArr,
  element,
  correct,
  qid
}) {
  return {
    qid: qid || uid(),
    type: "membership",
    letter,
    setArr: [...setArr].sort((a, b) => a - b),
    element,
    correct
  };
}
function makeCountQuestion({
  letter = "A",
  tokens,
  note,
  qid
}) {
  const unique = new Set(tokens.map(t => t.trim().toLowerCase()).filter(Boolean));
  return {
    qid: qid || uid(),
    type: "count",
    letter,
    display: tokens.map(t => t.trim()).filter(Boolean),
    correct: unique.size,
    note: note && note.trim() ? note.trim() : null
  };
}
function deriveSetOpFields(aTokens, bTokens, extraTokens = []) {
  const aItems = toItems(aTokens);
  const bItems = toItems(bTokens);
  const bIds = new Set(bItems.map(x => x.id));
  const aIds = new Set(aItems.map(x => x.id));
  const overlap = aItems.filter(x => bIds.has(x.id));
  const onlyA = aItems.filter(x => !bIds.has(x.id));
  const onlyB = bItems.filter(x => !aIds.has(x.id));
  const setA = [...onlyA, ...overlap];
  const setB = [...onlyB, ...overlap];
  const extras = toItems(extraTokens).filter(x => !aIds.has(x.id) && !bIds.has(x.id));
  const options = shuffle([...setA, ...setB, ...extras]).filter((v, idx, arr) => arr.findIndex(x => x.id === v.id) === idx);
  return {
    onlyA,
    overlap,
    onlyB,
    setA,
    setB,
    options
  };
}
function makeSetOpQuestion({
  aTokens,
  bTokens,
  extraTokens = [],
  mode = "unija",
  displayStyle = "plain",
  qid
}) {
  const {
    onlyA,
    overlap,
    onlyB,
    setA,
    setB,
    options
  } = deriveSetOpFields(aTokens, bTokens, extraTokens);
  const isEmptyIntersection = mode === "presjek" && overlap.length === 0;
  const correctIds = mode === "unija" ? [...onlyA, ...overlap, ...onlyB].map(x => x.id) : isEmptyIntersection ? [EMPTY_OPTION.id] : overlap.map(x => x.id);
  const finalOptions = isEmptyIntersection ? [...options, EMPTY_OPTION] : options;
  const question = mode === "unija" ? "Odaberi sve elemente skupa A ∪ B (unija)." : "Odaberi sve elemente skupa A ∩ B (presjek).";
  return {
    qid: qid || uid(),
    type: "setop",
    displayStyle,
    kind: "words",
    setA,
    setB,
    onlyA,
    overlap,
    onlyB,
    options: finalOptions,
    mode,
    question,
    correctIds
  };
}
function makeSubsetQuestion({
  aTokens,
  bTokens,
  displayStyle = "plain",
  qid
}) {
  const {
    onlyA,
    overlap,
    onlyB,
    setA,
    setB
  } = deriveSetOpFields(aTokens, bTokens, []);
  const correct = onlyA.length === 0 && setA.length > 0;
  return {
    qid: qid || uid(),
    type: "subset",
    displayStyle,
    kind: "words",
    setA,
    setB,
    onlyA,
    overlap,
    onlyB,
    correct
  };
}

// One-line human-readable summary of a question, for the teacher's question-bank list.
function describeQuestion(q) {
  if (q.type === "membership") {
    return `${q.letter} = {${q.setArr.join(", ")}}  —  je li ${q.element} ∈ ${q.letter}? (${q.correct ? "DA" : "NE"})`;
  }
  if (q.type === "count") {
    return `${q.letter} = {${q.display.join(", ")}}  —  koliko elemenata? (${q.correct})`;
  }
  if (q.type === "setop") {
    return `A = {${renderSetInline(q.setA)}}, B = {${renderSetInline(q.setB)}}  —  ${q.mode === "unija" ? "A ∪ B" : "A ∩ B"}`;
  }
  if (q.type === "subset") {
    return `A = {${renderSetInline(q.setA)}}, B = {${renderSetInline(q.setB)}}  —  A ⊆ B? (${q.correct ? "DA" : "NE"})`;
  }
  return "Zadatak";
}
